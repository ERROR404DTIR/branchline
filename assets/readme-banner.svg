<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Branchline — Git graph simulator</title><desc id="d">Animated branching commit graph showing a feature branch and merge.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15233d"/><stop offset="1" stop-color="#090f1c"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><g stroke-width="5" fill="none" stroke-linecap="round"><path d="M100 160H330Q420 160 500 90H760Q850 90 960 160H1090" stroke="#62e3c1"/><path d="M330 160Q420 160 500 240H760Q850 240 960 160" stroke="#8fa8ff" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-88" dur="3s" repeatCount="indefinite"/></path></g><g fill="#0b1425" stroke-width="5"><circle cx="100" cy="160" r="15" stroke="#62e3c1"/><circle cx="330" cy="160" r="15" stroke="#62e3c1"/><circle cx="500" cy="90" r="15" stroke="#62e3c1"/><circle cx="500" cy="240" r="15" stroke="#8fa8ff"/><circle cx="760" cy="90" r="15" stroke="#62e3c1"/><circle cx="760" cy="240" r="15" stroke="#8fa8ff"/><circle cx="960" cy="160" r="17" stroke="#ffc77a"><animate attributeName="r" values="15;19;15" dur="2s" repeatCount="indefinite"/></circle></g><g fill="#edf3ff" font-family="monospace" font-size="14"><text x="80" y="205">INIT</text><text x="300" y="205">COMMIT</text><text x="470" y="55">MAIN</text><text x="470" y="285">FEATURE</text><text x="925" y="205">MERGE</text></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">BRANCHLINE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">COMMITS / BRANCHES / MERGES</text></svg>